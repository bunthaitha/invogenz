name: Deploy Invogenz (Edge & Microservice Artifact)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INTERSERVER_FTP_HOST: ${{ secrets.INTERSERVER_FTP_HOST }}
      INTERSERVER_FTP_USER: ${{ secrets.INTERSERVER_FTP_USER }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup PHP for PDF engine packaging
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, gd, zip
          coverage: none

      - name: 3. Install production dependencies without dev tools
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 4. Build and package backend PDF microservice artifact
        run: |
          mkdir -p build_artifact/public
          mkdir -p build_artifact/bootstrap/cache
          mkdir -p build_artifact/storage/framework/cache/data
          mkdir -p build_artifact/storage/framework/sessions
          mkdir -p build_artifact/storage/framework/views
          mkdir -p build_artifact/storage/logs

          # Copy core execution runtime (Zero-source-repo exposure)
          cp -r app build_artifact/
          cp -r bootstrap build_artifact/
          cp -r config build_artifact/
          cp -r public build_artifact/
          cp -r resources build_artifact/
          cp -r routes build_artifact/
          cp -r storage build_artifact/
          cp -r vendor build_artifact/
          cp artisan build_artifact/
          cp index.php build_artifact/
          cp .htaccess build_artifact/
          cp composer.json build_artifact/
          cp composer.lock build_artifact/

          # Clean caches & dev logs
          rm -rf build_artifact/bootstrap/cache/*.php
          rm -rf build_artifact/storage/framework/cache/data/*
          rm -rf build_artifact/storage/framework/sessions/*
          rm -rf build_artifact/storage/framework/views/*
          rm -rf build_artifact/storage/logs/*.log

      - name: 5. Deploy Cloudflare Edge Gateway Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 6. Deploy compiled runtime to Interserver Hosting via FTP/SFTP
        if: env.INTERSERVER_FTP_HOST != '' && env.INTERSERVER_FTP_USER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INTERSERVER_FTP_HOST }}
          username: ${{ secrets.INTERSERVER_FTP_USER }}
          password: ${{ secrets.INTERSERVER_FTP_PASSWORD }}
          local-dir: build_artifact/
          server-dir: public_html/
          dangerous-clean-slate: false
